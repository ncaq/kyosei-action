name: Kyosei Code Review
author: ncaq
description: Multi-perspective AI code review for pull requests using the Kyosei plugin from Konoka marketplace

branding:
  icon: "check-square"
  color: "blue"

inputs:
  # Authentication (at least one required).
  # Typically only one is needed.
  # If multiple are provided they are passed through to claude-code-action as-is.
  claude_code_oauth_token:
    description: Claude Code OAuth token
    required: false
    default: ""
  anthropic_api_key:
    description: Anthropic API key (alternative to OAuth token)
    required: false
    default: ""
  use_bedrock:
    description: Use Amazon Bedrock with OIDC authentication
    required: false
    default: "false"
  use_vertex:
    description: Use Google Vertex AI with OIDC authentication
    required: false
    default: "false"
  use_foundry:
    description: Use Microsoft Foundry with OIDC authentication
    required: false
    default: "false"
  custom_github_token:
    description: >-
      GitHub token for API access.
      If omitted, claude-code-action uses Claude GitHub App token (claude[bot]).
      Provide explicitly to use a custom token or github.token instead.
      Named custom_github_token to avoid the reserved github_token input name.
    required: false
    default: ""

  # Claude Code Action pass-through
  allowed_bots:
    description: >-
      Comma-separated list of allowed bot usernames, or '*' to allow all bots.
      Defaults to '*' because bots are not inherently more dangerous than humans.
    required: false
    default: "*"
  allowed_non_write_users:
    description: >-
      Comma-separated list of users without write permission who are allowed to trigger Claude,
      or '*' to allow all. Only works when custom_github_token is provided.
      Enables bubblewrap sandbox and env scrubbing for safety.
    required: false
    default: ""
  include_comments_by_actor:
    description: >-
      Filter to include only comments from specific actors.
      Supports wildcards (e.g. '*[bot]'). Empty means include all.
    required: false
    default: ""
  exclude_comments_by_actor:
    description: >-
      Filter to exclude comments from specific actors.
      Supports wildcards. Exclusion takes precedence over inclusion.
    required: false
    default: ""
  additional_permissions:
    description: >-
      Additional GitHub permissions for the App token (newline-separated 'key: value').
      Example: 'actions: read' enables CI/CD failure analysis.
      Only effective with OIDC token exchange (ignored when custom_github_token is set).
    required: false
    default: ""
  settings:
    description: >-
      Claude Code settings as a JSON string or path to a JSON file.
      Merged with existing settings (input takes precedence).
      Can configure hooks, env, MCP settings, etc.
    required: false
    default: ""

  # Claude Code configuration
  model:
    description: Claude model to use
    required: false
    default: "opus"
  effort:
    description: >-
      Reasoning effort level for the top-level orchestrator session
      (low, medium, high, xhigh, max).
      The kyosei skill itself only dispatches reviewer subagents and posts JSON,
      so a lower level reduces cost and latency without affecting review quality.
      Reviewer subagents declare their own effort in agent frontmatter,
      which overrides this session-level value per Claude Code's agent fields spec.
      Set to an empty string to omit the flag and use the model default.
    required: false
    default: "low"
  allowed_tools:
    description: >-
      Allowed tools for Claude Code (newline-separated, replaces the default set below).
      The default is limited to read-only, non-destructive tools;
      posting reviews is handled by the kyosei skill itself, not directly by Claude.
      List each GitHub MCP tool individually as `mcp__github__<tool_name>`,
      because claude-code-action only starts the GitHub MCP server
      when a tool name begins with `mcp__github__`
      (the bare `mcp__github` prefix does not work).
      The default also allows what the bundled plugins need:
      the `Agent` tool and the MCP servers used by the research survey agent
      (`mcp__backlog__*`, `mcp__plugin_nix-tasuke_nixos`, `mcp__plugin_research_*`).
      The `mcp__plugin_*` servers ship with the bundled plugins and work out of the box.
      Backlog (`mcp__backlog__*`) is not bundled, so it only works
      if you configure the Backlog MCP server yourself (for example via `.mcp.json`).
    required: false
    default: |
      Agent
      Bash(awk:*)
      Bash(gh issue list:*)
      Bash(gh issue status:*)
      Bash(gh issue view:*)
      Bash(gh label list:*)
      Bash(gh label view:*)
      Bash(gh pr checks:*)
      Bash(gh pr diff:*)
      Bash(gh pr list:*)
      Bash(gh pr status:*)
      Bash(gh pr view:*)
      Bash(gh release list:*)
      Bash(gh release view:*)
      Bash(gh repo view:*)
      Bash(gh ruleset list:*)
      Bash(gh ruleset view:*)
      Bash(gh run list:*)
      Bash(gh run view:*)
      Bash(gh search:*)
      Bash(gh status:*)
      Bash(gh workflow list:*)
      Bash(gh workflow view:*)
      Bash(git blame:*)
      Bash(git cat-file:*)
      Bash(git describe:*)
      Bash(git diff:*)
      Bash(git for-each-ref:*)
      Bash(git log:*)
      Bash(git ls-files:*)
      Bash(git ls-remote:*)
      Bash(git ls-tree:*)
      Bash(git rev-list:*)
      Bash(git rev-parse:*)
      Bash(git shortlog:*)
      Bash(git show-branch:*)
      Bash(git show:*)
      Bash(git status:*)
      Bash(jq:*)
      Bash(node:*)
      Glob
      Grep
      Read
      Skill
      Task
      TodoWrite
      WebFetch
      WebSearch
      mcp__backlog__get_issue
      mcp__backlog__get_issue_comments
      mcp__backlog__get_issues
      mcp__backlog__get_myself
      mcp__backlog__get_notifications
      mcp__backlog__get_project
      mcp__backlog__get_project_list
      mcp__backlog__get_pull_request
      mcp__backlog__get_pull_requests
      mcp__backlog__get_wiki
      mcp__backlog__get_wiki_pages
      mcp__github__get_code_scanning_alert
      mcp__github__get_commit
      mcp__github__get_dependabot_alert
      mcp__github__get_discussion
      mcp__github__get_discussion_comments
      mcp__github__get_file_contents
      mcp__github__get_issue
      mcp__github__get_issue_comments
      mcp__github__get_job_logs
      mcp__github__get_label
      mcp__github__get_latest_release
      mcp__github__get_me
      mcp__github__get_pull_request
      mcp__github__get_pull_request_diff
      mcp__github__get_pull_request_files
      mcp__github__get_pull_request_review_comments
      mcp__github__get_pull_request_reviews
      mcp__github__get_pull_request_status
      mcp__github__get_release_by_tag
      mcp__github__get_secret_scanning_alert
      mcp__github__get_tag
      mcp__github__get_team_members
      mcp__github__get_teams
      mcp__github__get_workflow_run
      mcp__github__issue_read
      mcp__github__list_branches
      mcp__github__list_code_scanning_alerts
      mcp__github__list_commits
      mcp__github__list_dependabot_alerts
      mcp__github__list_discussion_categories
      mcp__github__list_discussions
      mcp__github__list_issue_types
      mcp__github__list_issues
      mcp__github__list_pull_requests
      mcp__github__list_releases
      mcp__github__list_secret_scanning_alerts
      mcp__github__list_sub_issues
      mcp__github__list_tags
      mcp__github__list_workflow_jobs
      mcp__github__list_workflow_runs
      mcp__github__list_workflows
      mcp__github__pull_request_read
      mcp__github__search_code
      mcp__github__search_issues
      mcp__github__search_pull_requests
      mcp__github__search_repositories
      mcp__github__search_users
      mcp__plugin_nix-tasuke_nixos
      mcp__plugin_research_cloudflare
      mcp__plugin_research_context7
      mcp__plugin_research_deepwiki
      mcp__plugin_research_mdn
      mcp__plugin_research_microsoft-learn
  additional_allowed_tools:
    description: Additional allowed tools to append to allowed_tools (newline-separated)
    required: false
    default: ""
  claude_args:
    description: >-
      Additional arguments to pass to Claude CLI
      (appended after --model and --allowed-tools)
    required: false
    default: ""

  # UI control
  include_fix_links:
    description: Include 'Fix this' deep links in PR review feedback
    required: false
    default: "true"
  display_report:
    description: >-
      Display Claude Code Report in GitHub Step Summary.
      Useful for understanding what Claude did during the review.
      "auto" (default) enables it only for private repositories.
      "always" enables it regardless of repository visibility.
      "never" disables it entirely.
      "true"/"false" are accepted as aliases for backward compatibility.
    required: false
    default: "auto"
  show_full_output:
    description: >-
      Show full Claude Code JSON output in Actions logs.
      May contain secrets in tool results; use only for debugging.
      Ignored on public repositories to prevent secret leakage.
    required: false
    default: "false"

  # Marketplace and plugin
  marketplace_url:
    description: Git URL of the plugin marketplace
    required: false
    default: "https://github.com/ncaq/konoka.git"
  plugin_name:
    description: Plugin identifier within the marketplace (newline-separated for multiple)
    required: false
    default: |-
      kyosei@konoka
      research@konoka

  # Self-hosted runner support
  self_hosted_packages:
    description: >-
      Newline-separated list of packages to install via apt-get on self-hosted runners.
      Installation runs only when the runner is self-hosted and apt-get is available.
      Set to an empty string to skip installation entirely.
    required: false
    default: |
      curl
      gawk
      gh
      git
      jq
      zstd

outputs:
  execution_file:
    description: Path to the Claude Code execution output file
    value: ${{ steps.claude-review.outputs.execution_file }}
  session_id:
    description: Claude Code session ID for resuming conversation
    value: ${{ steps.claude-review.outputs.session_id }}

runs:
  using: composite
  steps:
    - name: Install packages for self-hosted runner
      if: runner.environment == 'self-hosted' && inputs.self_hosted_packages != ''
      shell: bash
      env:
        PACKAGES: ${{ inputs.self_hosted_packages }}
      run: |
        if ! command -v apt-get &>/dev/null; then
          echo "apt-get not found. Skipping package installation."
          exit 0
        fi
        sudo apt-get update -qq
        # Convert newline-separated list to a bash array, then install.
        mapfile -t pkgs < <(echo "$PACKAGES" | sed '/^[[:space:]]*$/d')
        sudo apt-get install -y --no-install-recommends "${pkgs[@]}"

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "lts/*"

    - name: Check required commands
      shell: bash
      run: |
        missing=()
        for cmd in curl gh git node; do
          if ! command -v "$cmd" &>/dev/null; then
            missing+=("$cmd")
          fi
        done
        if (( ${#missing[@]} > 0 )); then
          echo "::error::Required commands not found: ${missing[*]}. Install them manually or configure self_hosted_packages."
          exit 1
        fi
        echo "All required commands available."

    - name: Validate inputs
      shell: bash
      env:
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude_code_oauth_token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        USE_BEDROCK: ${{ inputs.use_bedrock }}
        USE_VERTEX: ${{ inputs.use_vertex }}
        USE_FOUNDRY: ${{ inputs.use_foundry }}
        MARKETPLACE_URL: ${{ inputs.marketplace_url }}
        PLUGIN_NAME: ${{ inputs.plugin_name }}
        MODEL: ${{ inputs.model }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        echo "::group::Validate inputs"
        errors=()

        # Authentication: at least one credential must be provided unless
        # using cloud providers with OIDC.
        if [[ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]]; then
          echo "Authentication: OAuth token"
        elif [[ -n "$ANTHROPIC_API_KEY" ]]; then
          echo "Authentication: API key"
        elif [[ "$USE_BEDROCK" == "true" ]]; then
          echo "Authentication: Amazon Bedrock (OIDC)"
        elif [[ "$USE_VERTEX" == "true" ]]; then
          echo "Authentication: Google Vertex AI (OIDC)"
        elif [[ "$USE_FOUNDRY" == "true" ]]; then
          echo "Authentication: Microsoft Foundry (OIDC)"
        else
          errors+=("Either claude_code_oauth_token, anthropic_api_key, or a cloud provider (use_bedrock/use_vertex/use_foundry) must be set.")
        fi

        # Cloud providers are mutually exclusive.
        provider_count=0
        [[ "$USE_BEDROCK" == "true" ]] && ((provider_count++))
        [[ "$USE_VERTEX" == "true" ]] && ((provider_count++))
        [[ "$USE_FOUNDRY" == "true" ]] && ((provider_count++))
        if (( provider_count > 1 )); then
          errors+=("Only one cloud provider (use_bedrock, use_vertex, use_foundry) can be enabled at a time.")
        fi

        echo "Model: $MODEL"
        echo "Plugin: $PLUGIN_NAME"
        echo "Marketplace: $MARKETPLACE_URL"
        echo "PR: #$PR_NUMBER"

        # Marketplace URL must end with .git (required by claude-code-action).
        if [[ -n "$MARKETPLACE_URL" && "$MARKETPLACE_URL" != *.git ]]; then
          errors+=("marketplace_url must end with '.git': $MARKETPLACE_URL")
        fi

        # Plugin name must not be empty.
        if [[ -z "$PLUGIN_NAME" ]]; then
          errors+=("plugin_name must not be empty.")
        fi

        # Model must not be empty.
        if [[ -z "$MODEL" ]]; then
          errors+=("model must not be empty.")
        fi

        # This action only works on pull_request events.
        if [[ -z "$PR_NUMBER" ]]; then
          errors+=("This action requires a pull_request event context (github.event.pull_request.number is missing).")
        fi

        if (( ${#errors[@]} > 0 )); then
          echo "::endgroup::"
          for error in "${errors[@]}"; do
            echo "::error::$error"
          done
          exit 1
        fi

        echo "All inputs valid."
        echo "::endgroup::"

    - name: Resolve display_report
      id: resolve-display-report
      shell: bash
      env:
        DISPLAY_REPORT: ${{ inputs.display_report }}
        IS_PRIVATE: ${{ github.event.repository.private }}
        RUNNER_DEBUG: ${{ runner.debug }}
      run: |
        # Normalize legacy values.
        case "$DISPLAY_REPORT" in
          true)  DISPLAY_REPORT="always" ;;
          false) DISPLAY_REPORT="never" ;;
        esac
        # Resolve "auto" based on repository visibility.
        case "$DISPLAY_REPORT" in
          always) enabled="true" ;;
          never)  enabled="false" ;;
          auto)   enabled="$IS_PRIVATE" ;;
          *)      echo "::error::Unknown display_report value: $DISPLAY_REPORT"; exit 1 ;;
        esac
        # When GitHub Actions debug logging is enabled
        # (ACTIONS_STEP_DEBUG=true, surfaced as runner.debug == "1"),
        # force the report on regardless of repository visibility.
        # The report only summarizes what Claude did,
        # so showing it on public repositories is acceptable for debugging.
        if [[ "$RUNNER_DEBUG" == "1" ]]; then
          enabled="true"
        fi
        echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

    # Export `$KYOSEI_ACTION_VERSION` via `$GITHUB_ENV`
    # so it propagates to all subsequent steps in the same job,
    # including the composite steps inside claude-code-action and
    # the Claude CLI subprocess they spawn.
    # Setting env: directly on the `Run Kyosei` step does not work
    # because composite actions do not inherit step-level env from the calling step.
    - name: Export action version
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        version=$(tr -d '[:space:]' < "$ACTION_PATH/VERSION")
        if [[ -z "$version" ]]; then
          echo "::warning::Failed to read version from $ACTION_PATH/VERSION"
        fi
        echo "KYOSEI_ACTION_VERSION=$version" >> "$GITHUB_ENV"

    - name: Build allowed tools list
      id: build-allowed-tools
      shell: bash
      env:
        ALLOWED_TOOLS: ${{ inputs.allowed_tools }}
        ADDITIONAL_ALLOWED_TOOLS: ${{ inputs.additional_allowed_tools }}
      run: |
        echo "::group::Build allowed tools list"
        # Combine and convert newline-separated tools to comma-separated.
        joined=$(printf '%s\n%s' "$ALLOWED_TOOLS" "$ADDITIONAL_ALLOWED_TOOLS" \
          | sed '/^[[:space:]]*$/d' \
          | paste -sd ',' -)
        echo "Allowed tools: $joined"
        echo "joined=$joined" >> "$GITHUB_OUTPUT"
        echo "::endgroup::"

    - name: Write user request for slash command support
      shell: bash
      env:
        PR_URL: ${{ github.event.pull_request.html_url }}
      run: |
        mkdir -p "${RUNNER_TEMP}/claude-prompts"
        echo "/kyosei ${PR_URL}" > "${RUNNER_TEMP}/claude-prompts/claude-user-request.txt"

    # claude-code-actionは自前でClaude Code CLIをインストールするが、
    # そのバージョンはaction側にハードコードされているため、
    # `v1.0.145`固定だとClaude Codeも`2.1.174`から上がらない。
    # Opus 5はClaude Code`2.1.219`で追加されて`opus`エイリアスの解決先になったので、
    # `2.1.174`のままでは`model: opus`がOpus 4系のままになる。
    # `path_to_claude_code_executable`を渡すとclaude-code-action側のインストールは、
    # 丸ごとスキップされてここでインストールしたバイナリが使われるため、
    # actionのバージョンを固定したままClaude Codeだけ新しく出来る。
    #
    # `curl https://claude.ai/install.sh | bash`は検証点を持てないので使わない。
    # 代わりに配布元から直接バイナリを取得して、
    # バージョンごとに不変な`manifest.json`のSHA-256を固定値として持ち、
    # そこに書かれているプラットフォーム別のチェックサムで、
    # 実際に実行するバイナリを検証する。
    # バージョンとプラットフォームはキャッシュキーとインストールの両方から参照するので、
    # ここで一度だけ決めてstepのoutputとして渡す。
    - name: Resolve Claude Code target
      id: claude-code
      shell: bash
      env:
        # Opus 5を使うには`2.1.219`以上が必要。
        # <https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md>
        CLAUDE_CODE_VERSION: "2.1.220"
        # バージョンを上げる時は以下のコマンドで取り直す。
        # curl -fsSL https://downloads.claude.ai/claude-code-releases/<version>/manifest.json | sha256sum
        CLAUDE_CODE_MANIFEST_SHA256: "40f281ff188f1cd4f39309da41a219014dad2555d96e9780c67a2138720d12ed"
      run: |
        case "$(uname -s)" in
          Darwin) os=darwin ;;
          Linux) os=linux ;;
          *) echo "::error::Unsupported operating system: $(uname -s)"; exit 1 ;;
        esac
        case "$(uname -m)" in
          x86_64 | amd64) arch=x64 ;;
          arm64 | aarch64) arch=arm64 ;;
          *) echo "::error::Unsupported architecture: $(uname -m)"; exit 1 ;;
        esac
        platform="$os-$arch"
        # musl libc based Linux distributions have their own build.
        if [[ "$os" == "linux" ]] && ldd /bin/ls 2>&1 | grep -q musl; then
          platform="$platform-musl"
        fi

        install_dir="${RUNNER_TEMP}/claude-code"
        {
          echo "version=$CLAUDE_CODE_VERSION"
          echo "manifest-sha256=$CLAUDE_CODE_MANIFEST_SHA256"
          echo "platform=$platform"
          echo "dir=$install_dir"
          echo "path=$install_dir/claude"
        } >> "$GITHUB_OUTPUT"

    # バイナリは250MB以上あるので、
    # バージョンとプラットフォームが同じなら再ダウンロードは避ける。
    - name: Restore cached Claude Code
      id: cache-claude-code
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.claude-code.outputs.dir }}
        key: claude-code-${{ steps.claude-code.outputs.platform }}-${{ steps.claude-code.outputs.version }}

    - name: Install Claude Code
      if: steps.cache-claude-code.outputs.cache-hit != 'true'
      shell: bash
      env:
        BASE_URL: https://downloads.claude.ai/claude-code-releases
        VERSION: ${{ steps.claude-code.outputs.version }}
        MANIFEST_SHA256: ${{ steps.claude-code.outputs.manifest-sha256 }}
        PLATFORM: ${{ steps.claude-code.outputs.platform }}
        INSTALL_DIR: ${{ steps.claude-code.outputs.dir }}
      run: |
        echo "::group::Install Claude Code v$VERSION"
        mkdir -p "$INSTALL_DIR"

        # `--proto '=https'` also rejects a redirect to plain HTTP.
        download() {
          curl --proto "=https" --tlsv1.2 --fail --silent --show-error --location \
            --retry 3 --retry-delay 5 --output "$1" "$2"
        }

        # macOS has no `sha256sum`.
        sha256() {
          if command -v sha256sum > /dev/null; then
            sha256sum "$1" | cut -d ' ' -f 1
          else
            shasum -a 256 "$1" | cut -d ' ' -f 1
          fi
        }

        verify() {
          local actual
          actual=$(sha256 "$1")
          if [[ "$actual" != "$2" ]]; then
            echo "::error::Checksum mismatch for $1: expected $2, got $actual"
            exit 1
          fi
        }

        download "$INSTALL_DIR/manifest.json" "$BASE_URL/$VERSION/manifest.json"
        verify "$INSTALL_DIR/manifest.json" "$MANIFEST_SHA256"

        # Fails when the platform is missing from the manifest, thanks to `--exit-status`.
        checksum=$(jq --raw-output --exit-status --arg platform "$PLATFORM" \
          '.platforms[$platform].checksum' "$INSTALL_DIR/manifest.json")
        download "$INSTALL_DIR/claude" "$BASE_URL/$VERSION/$PLATFORM/claude"
        verify "$INSTALL_DIR/claude" "$checksum"
        chmod +x "$INSTALL_DIR/claude"

        echo "Installed $("$INSTALL_DIR/claude" --version) for $PLATFORM"
        echo "::endgroup::"

    - name: Run Kyosei
      id: claude-review
      continue-on-error: true
      # claude-code-action`v1.0.146`でagent modeの起動時に
      # `${RUNNER_TEMP}/claude-prompts`を`rm -rf`するようになった。
      # <https://github.com/anthropics/claude-code-action/pull/1288>
      # この変更により後続のWrite user requestステップが書く`claude-user-request.txt`が、
      # claude-code-action起動時に消去され、
      # SDK側でスラッシュコマンドを含むマルチブロックメッセージが生成されず、
      # `/kyosei`が展開されないままClaudeに渡るようになりレビューが動かなくなった。
      # 暫定対応として直前の`v1.0.145`に固定する。
      # ただしそれに引きずられてClaude Code CLIまで古くなるのを避けるため、
      # CLIだけは直前のInstall Claude Codeステップで入れた新しいものを使う。
      uses: anthropics/claude-code-action@ebcdfe6dc6bb7511eb63e59e07df256dbcf59a2e # v1.0.145
      with:
        path_to_claude_code_executable: ${{ steps.claude-code.outputs.path }}
        claude_code_oauth_token: ${{ inputs.claude_code_oauth_token }}
        anthropic_api_key: ${{ inputs.anthropic_api_key }}
        use_bedrock: ${{ inputs.use_bedrock }}
        use_vertex: ${{ inputs.use_vertex }}
        use_foundry: ${{ inputs.use_foundry }}
        github_token: ${{ inputs.custom_github_token }} # Pass as-is (empty means claude-code-action uses Claude GitHub App token).
        allowed_bots: ${{ inputs.allowed_bots }}
        allowed_non_write_users: ${{ inputs.allowed_non_write_users }}
        include_comments_by_actor: ${{ inputs.include_comments_by_actor }}
        exclude_comments_by_actor: ${{ inputs.exclude_comments_by_actor }}
        additional_permissions: ${{ inputs.additional_permissions }}
        settings: ${{ inputs.settings }}
        include_fix_links: ${{ inputs.include_fix_links == 'true' && 'true' || 'false' }}
        display_report: ${{ steps.resolve-display-report.outputs.enabled }}
        # Enable full output when explicitly requested,
        # or when GitHub Actions debug logging is on (runner.debug == "1").
        # The full trace may contain secrets,
        # so it stays restricted to private repositories either way.
        show_full_output: ${{ ((inputs.show_full_output == 'true' || runner.debug == '1') && github.event.repository.private) && 'true' || 'false' }}
        claude_args: >-
          --model "${{ inputs.model }}"
          ${{ inputs.effort != '' && format('--effort "{0}"', inputs.effort) || '' }}
          --allowed-tools "${{ steps.build-allowed-tools.outputs.joined }}"
          ${{ inputs.claude_args }}
        plugin_marketplaces: ${{ inputs.marketplace_url }}
        plugins: ${{ inputs.plugin_name }}
        prompt: "Follow the user request."

    # If claude-code-action fails, emit a warning instead of failing the workflow.
    # Common causes: insufficient token permissions
    # (e.g. workflow file changes in the PR, fork PRs) or transient API errors.
    - name: Handle failure
      if: steps.claude-review.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::Kyosei failed. This may be due to insufficient token permissions (e.g. workflow file changes in this PR, or fork PRs) or a transient error. Skipping."
